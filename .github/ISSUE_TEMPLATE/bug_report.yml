name: Bug report
description: Report a broken page, failed build, or incorrect data display
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug. Please fill in as much detail as possible."
  - type: input
    id: page
    attributes:
      label: Affected page or component
      placeholder: "e.g. /catalogue, Dataset detail for KEN-LV_LC_2023_ILRI_v1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "e.g. Chrome 125 / macOS"
