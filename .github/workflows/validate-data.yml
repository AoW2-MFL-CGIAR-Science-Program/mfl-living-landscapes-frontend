# .github/workflows/validate-data.yml
name: Validate Dataset Metadata

on:
  pull_request:
    paths:
      - "frontend/data/**"
      - ".github/workflows/validate-data.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run metadata validator
        run: python scripts/validate_datasets.py frontend/data/datasets.json
